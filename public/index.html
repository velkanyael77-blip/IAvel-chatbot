<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Corrección de viewport para desbloquear el enfoque en teclados táctiles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>IAvel Chatbot</title>
  <style>
    :root {
      --bg-dark: #1e1e2f;
      --bg-sidebar: #141421;
      --bg-chat: #2a2a40;
      --accent: #6c5ce7;
      --text-main: #ffffff;
      --border-color: #3f3f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #app {
      display: flex;
      height: 100%;
      width: 100%;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    .btn-nuevo {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin-bottom: 5px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      cursor: pointer;
    }

    .chat-item.active {
      background: var(--accent);
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: #ff5252;
      cursor: pointer;
      font-weight: bold;
    }

    /* Chat Container */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.4;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: var(--accent);
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--bg-chat);
    }

    /* Formulario de entrada optimizado para táctil */
    .chat-input-area {
      display: flex;
      padding: 15px;
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border-color);
      gap: 10px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 14px 18px;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 25px;
      color: var(--text-main);
      outline: none;
      /* ⚠️ Clave para iOS/Android: 16px evita el bloqueo/zoom al tocar */
      font-size: 16px !important;
      -webkit-user-select: text;
      user-select: text;
    }

    .chat-input-area button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Ocultar barra lateral en pantallas pequeñas */
    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="sidebar">
      <button class="btn-nuevo" onclick="crearNuevoChat()">+ Nuevo Chat</button>
      <div class="chat-list" id="chatList"></div>
    </div>
    
    <div class="main-content">
      <div class="chat-messages" id="chatMessages"></div>
      
      <form class="chat-input-area" onsubmit="handleSend(event)">
        <input 
          type="text" 
          id="userInput" 
          placeholder="Escribe un mensaje..." 
          autocomplete="off"
        >
        <button type="submit">Enviar</button>
      </form>
    </div>
  </div>

  <script>
    let currentChatId = null;

    async function cargarChats() {
      const res = await fetch('/api/chats');
      const chats = await res.json();
      const listContainer = document.getElementById('chatList');
      listContainer.innerHTML = '';

      chats.forEach(chat => {
        const div = document.createElement('div');
        div.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
        div.onclick = () => seleccionarChat(chat.id);
        div.innerHTML = `
          <span>${chat.titulo}</span>
          <button class="btn-delete" onclick="eliminarChat(event, '${chat.id}')">✕</button>
        `;
        listContainer.appendChild(div);
      });

      if (!currentChatId && chats.length > 0) {
        seleccionarChat(chats[0].id);
      } else if (chats.length === 0) {
        crearNuevoChat();
      }
    }

    async function crearNuevoChat() {
      const res = await fetch('/api/chats/nuevo', { method: 'POST' });
      const chat = await res.json();
      currentChatId = chat.id;
      await cargarChats();
      seleccionarChat(chat.id);
    }

    async function seleccionarChat(id) {
      currentChatId = id;
      const res = await fetch(`/api/chats/${id}`);
      if (!res.ok) return;
      const data = await res.json();
      
      const container = document.getElementById('chatMessages');
      container.innerHTML = '';
      
      data.mensajes.forEach(msg => {
        agregarMensajePantalla(msg.role, msg.content);
      });

      cargarChats();
    }

    async function eliminarChat(e, id) {
      e.stopPropagation();
      await fetch(`/api/chats/${id}`, { method: 'DELETE' });
      if (currentChatId === id) currentChatId = null;
      cargarChats();
    }

    function agregarMensajePantalla(role, content) {
      const container = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = content;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    async function handleSend(e) {
      e.preventDefault();
      const input = document.getElementById('userInput');
      const message = input.value.trim();
      if (!message || !currentChatId) return;

      input.value = '';
      agregarMensajePantalla('user', message);

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chatId: currentChatId, message })
        });
        const data = await res.json();
        
        if (data.reply) {
          agregarMensajePantalla('assistant', data.reply);
          cargarChats();
        }
      } catch (err) {
        console.error(err);
      }
    }

    cargarChats();
  </script>
</body>
</html>
