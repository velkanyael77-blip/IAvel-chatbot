<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>IAvel Chatbot</title>
  <style>
    :root {
      /* Tema Verde */
      --bg-dark: #0a110e;
      --bg-sidebar: #111e19;
      --bg-chat: #182822;
      --accent: #10b981; /* Verde esmeralda principal */
      --accent-hover: #059669;
      --text-main: #e6f4f1;
      --text-muted: #80a89d;
      --border-color: #1f382f;
      --message-user: #064e3b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    #app {
      display: flex;
      height: 100%;
      width: 100%;
      position: relative;
    }

    /* Encabezado Superior (Mobile) con Botón Hamburguesa */
    .top-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    .hamburger-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--accent);
      font-size: 22px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .top-title {
      font-weight: bold;
      color: var(--accent);
      font-size: 1.1rem;
    }

    /* Sidebar / Barra Lateral */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 15px;
      transition: transform 0.3s ease;
      z-index: 20;
    }

    .btn-nuevo {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 15px;
      transition: background 0.2s;
    }

    .btn-nuevo:hover {
      background: var(--accent-hover);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      margin-bottom: 6px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .chat-item:hover {
      background: rgba(16, 185, 129, 0.1);
    }

    .chat-item.active {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--accent);
    }

    .chat-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.9rem;
      max-width: 170px;
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: #f87171;
      cursor: pointer;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .btn-delete:hover {
      background: rgba(248, 113, 113, 0.2);
    }

    /* Contenido Principal / Área de Chat */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.4;
      word-break: break-word;
      font-size: 0.95rem;
    }

    .message.user {
      align-self: flex-end;
      background: var(--message-user);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--bg-chat);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 2px;
    }

    /* Formulario de Entrada */
    .chat-input-area {
      display: flex;
      padding: 15px;
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border-color);
      gap: 10px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 14px 18px;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 25px;
      color: var(--text-main);
      outline: none;
      font-size: 16px !important;
      -webkit-user-select: text;
      user-select: text;
    }

    .chat-input-area input:focus {
      border-color: var(--accent);
    }

    .chat-input-area button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0 20px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .chat-input-area button:hover {
      background: var(--accent-hover);
    }

    /* Fondo Oscuro al abrir menú en Celular (Overlay) */
    .sidebar-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 15;
    }

    /* Adaptatividad para Pantallas Pequeñas (Móviles / Tablets) */
    @media (max-width: 768px) {
      #app {
        flex-direction: column;
      }

      .top-header {
        display: flex;
      }

      .sidebar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay.open {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Overlay para cerrar menú en móvil -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMenu()"></div>

    <!-- Barra Lateral -->
    <div class="sidebar" id="sidebar">
      <button class="btn-nuevo" onclick="crearNuevoChat()">+ Nuevo Chat</button>
      <div class="chat-list" id="chatList"></div>
    </div>
    
    <!-- Área Principal -->
    <div class="main-content">
      <!-- Encabezado con Botón Hamburguesa en Celulares -->
      <div class="top-header">
        <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
        <span class="top-title">IAvel</span>
        <div style="width: 30px;"></div>
      </div>

      <div class="chat-messages" id="chatMessages"></div>
      
      <form class="chat-input-area" onsubmit="handleSend(event)">
        <input 
          type="text" 
          id="userInput" 
          placeholder="Escribe un mensaje..." 
          autocomplete="off"
        >
        <button type="submit">Enviar</button>
      </form>
    </div>
  </div>

  <script>
    let currentChatId = null;

    function getUserId() {
      let userId = localStorage.getItem('iavel_user_id');
      if (!userId) {
        userId = 'user_' + Math.random().toString(36).substring(2, 11) + Date.now();
        localStorage.setItem('iavel_user_id', userId);
      }
      return userId;
    }

    const USER_ID = getUserId();

    function toggleMenu() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
    }

    async function cargarChats() {
      const res = await fetch(`/api/chats?userId=${USER_ID}`);
      const chats = await res.json();
      const listContainer = document.getElementById('chatList');
      listContainer.innerHTML = '';

      chats.forEach(chat => {
        const div = document.createElement('div');
        div.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
        div.onclick = () => {
          seleccionarChat(chat.id);
          if (window.innerWidth <= 768) toggleMenu(); // Cerrar menú al seleccionar en móvil
        };
        div.innerHTML = `
          <span class="chat-title">${chat.titulo}</span>
          <button class="btn-delete" onclick="eliminarChat(event, '${chat.id}')">✕</button>
        `;
        listContainer.appendChild(div);
      });

      if (!currentChatId && chats.length > 0) {
        seleccionarChat(chats[0].id);
      } else if (chats.length === 0) {
        crearNuevoChat();
      }
    }

    async function crearNuevoChat() {
      const res = await fetch('/api/chats/nuevo', { 
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: USER_ID })
      });
      const chat = await res.json();
      currentChatId = chat.id;
      await cargarChats();
      seleccionarChat(chat.id);
    }

    async function seleccionarChat(id) {
      currentChatId = id;
      const res = await fetch(`/api/chats/${id}?userId=${USER_ID}`);
      if (!res.ok) return;
      const data = await res.json();
      
      const container = document.getElementById('chatMessages');
      container.innerHTML = '';
      
      data.mensajes.forEach(msg => {
        agregarMensajePantalla(msg.role, msg.content);
      });

      cargarChats();
    }

    async function eliminarChat(e, id) {
      e.stopPropagation();
      await fetch(`/api/chats/${id}?userId=${USER_ID}`, { method: 'DELETE' });
      if (currentChatId === id) currentChatId = null;
      cargarChats();
    }

    function agregarMensajePantalla(role, content) {
      const container = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = content;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    async function handleSend(e) {
      e.preventDefault();
      const input = document.getElementById('userInput');
      const message = input.value.trim();
      if (!message || !currentChatId) return;

      input.value = '';
      agregarMensajePantalla('user', message);

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chatId: currentChatId, userId: USER_ID, message })
        });
        const data = await res.json();
        
        if (data.reply) {
          agregarMensajePantalla('assistant', data.reply);
          cargarChats();
        }
      } catch (err) {
        console.error(err);
      }
    }

    cargarChats();
  </script>
</body>
</html>
